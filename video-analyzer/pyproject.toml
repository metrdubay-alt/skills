[project]
name = "video-analyzer"
version = "0.1.0"
description = "Multimodal video analysis: ASR + scene detection + LLM vision -> structured document"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "faster-whisper",
    "ctranslate2==4.6.0",
    "setuptools<81",
    "scenedetect[opencv]",
    "opencv-python",
    "imagehash",
    "pillow",
    "anthropic",
    "openai",
    "python-docx",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
video-analyzer = "video_analyzer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
